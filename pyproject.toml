[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repbed_processor"
version = "0.0.1"
authors = [
  { name="E Coral", email="corale@cardiff.ac.uk" },
]
description = "Tool for processing FSLR output (representative bed files)"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.0",
    "click",
    "natsort",
    "openpyxl"
]